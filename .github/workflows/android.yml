# Android library ai.newmean:pii (android/): JVM unit tests on Linux and macOS (the JNI library is also built for the host
# from the same CMakeLists.txt, so the native path runs without an emulator), lint, and the release AAR for arm64-v8a,
# armeabi-v7a and x86_64. The parity tests skip here: their fixtures and model copies are private. rc.yml calls this
# workflow for a release candidate.
name: android

on:
  push:
    branches: [main]
    paths: [android/**, native/core/**, .github/workflows/android.yml]
  pull_request:
    paths: [android/**, native/core/**, .github/workflows/android.yml]
  workflow_dispatch:
    inputs:
      os:
        description: "Runners outside newmean-ai/pii (the public repository always runs all): Linux x64 only, plus Windows (none here), or all"
        type: choice
        options: [linux, linux-windows, all]
        default: linux
  workflow_call:

permissions:
  contents: read

# Only this workflow's own dispatch or pull-request run is cancelled by a newer one for the same event and ref. A push run
# and a run called by rc.yml (github.workflow is then the caller's name) get a group of their own, so nothing cancels them.
concurrency:
  group: android-${{ (github.workflow == 'android' && github.event_name != 'push') && format('{0}-{1}', github.event_name, github.ref) || github.run_id }}
  cancel-in-progress: ${{ github.workflow == 'android' && github.event_name != 'push' }}

env:
  NDK_VERSION: 29.0.14206865

jobs:
  test:
    # on push only in the public repository; other copies of it run these by hand (workflow_dispatch)
    if: github.repository == 'newmean-ai/pii' || github.event_name == 'workflow_dispatch'
    strategy:
      fail-fast: false
      matrix:
        # every runner in the public repository; elsewhere the dispatch input os chooses (default: Linux x64 only)
        os: >-
          ${{ fromJSON((github.repository == 'newmean-ai/pii' || inputs.os == 'all')
          && '["ubuntu-latest", "macos-latest"]' || '["ubuntu-latest"]') }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    env:
      PII_SKIP_TIMING: "1"  # every step but the timing step: timing tests never share a step (CI3)
    defaults:
      run:
        working-directory: android
    steps:
      - uses: actions/checkout@v4
      # a full JDK (include/jni.h) for the host JNI library
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - uses: gradle/actions/setup-gradle@v4
      - run: yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --install "ndk;$NDK_VERSION" "cmake;3.22.1" > /dev/null
      - run: ./gradlew :pii:testDebugUnitTest --console=plain
      # one real download from Hugging Face (nano, 3.4 MB), checked against the pins and run through the JNI library
      - run: ./gradlew :pii:testDebugUnitTest --tests '*ModelStoreTest*' --rerun --console=plain
        env:
          PII_DOWNLOAD: "1"
      # the five tests with an assertion on measured time (the 1.7.2 release standard, CI3), alone: the two Growth classes
      # and the regex time limit; none may be skipped
      - name: Timing tests
        env:
          PII_SKIP_TIMING: "0"
        run: |
          ./gradlew :pii:testDebugUnitTest --tests '*Growth*' --tests '*RegexTest.longInputsTakeTimeInProportionToTheirLength' --rerun --console=plain
          ! grep -l "<skipped" pii/build/test-results/testDebugUnitTest/*.xml

  aar:
    if: github.repository == 'newmean-ai/pii' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    defaults:
      run:
        working-directory: android
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - uses: gradle/actions/setup-gradle@v4
      - run: yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --install "ndk;$NDK_VERSION" "cmake;3.22.1" > /dev/null
      - run: ./gradlew :pii:lintRelease :pii:assembleRelease :pii:publishReleasePublicationToLocalRepository --console=plain
      - name: Native libraries in the AAR
        run: unzip -l pii/build/outputs/aar/pii-release.aar 'jni/*'
      - uses: actions/upload-artifact@v4
        with:
          name: ai.newmean-pii-aar
          path: |
            android/pii/build/outputs/aar/pii-release.aar
            android/pii/build/repo/
          retention-days: ${{ github.repository == 'newmean-ai/pii' && 7 || 3 }}
