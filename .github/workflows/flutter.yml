# Flutter/Dart package (flutter/): analyze and test on the three desktop hosts (the build hook compiles native/core with
# clang, gcc and MSVC), and build the example app for Android and iOS. The parity tests skip here: their fixtures and
# model copies are private. rc.yml calls this workflow for a release candidate.
name: flutter

on:
  push:
    branches: [main]
    paths: [flutter/**, native/core/**, .github/workflows/flutter.yml]
  pull_request:
    paths: [flutter/**, native/core/**, .github/workflows/flutter.yml]
  workflow_dispatch:
    inputs:
      os:
        description: "Runners outside newmean-ai/pii (the public repository always runs all): Linux x64 only, plus Windows, or all"
        type: choice
        options: [linux, linux-windows, all]
        default: linux
  workflow_call:

permissions:
  contents: read

# Only this workflow's own dispatch or pull-request run is cancelled by a newer one for the same event and ref. A push run
# and a run called by rc.yml (github.workflow is then the caller's name) get a group of their own, so nothing cancels them.
concurrency:
  group: flutter-${{ (github.workflow == 'flutter' && github.event_name != 'push') && format('{0}-{1}', github.event_name, github.ref) || github.run_id }}
  cancel-in-progress: ${{ github.workflow == 'flutter' && github.event_name != 'push' }}

jobs:
  test:
    # on push only in the public repository; other copies of it run these by hand (workflow_dispatch)
    if: github.repository == 'newmean-ai/pii' || github.event_name == 'workflow_dispatch'
    strategy:
      fail-fast: false
      matrix:
        # every runner in the public repository; elsewhere the dispatch input os chooses (default: Linux x64 only)
        os: >-
          ${{ fromJSON((github.repository == 'newmean-ai/pii' || inputs.os == 'all')
          && '["macos-latest", "ubuntu-latest", "windows-latest"]'
          || inputs.os == 'linux-windows' && '["ubuntu-latest", "windows-latest"]' || '["ubuntu-latest"]') }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    env:
      PII_SKIP_TIMING: "1"  # every step but the timing step: timing tests never share a step (CI3)
    defaults:
      run:
        working-directory: flutter
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: 3.47.7
          channel: stable
          cache: true
      - run: dart pub get
      - run: dart format --output=none --set-exit-if-changed lib hook test tool
      - run: dart analyze --fatal-infos
      - run: dart test
      # one real download from Hugging Face (nano, 3.4 MB), checked against the pins
      - run: dart test test/loader_test.dart
        env:
          PII_DOWNLOAD: "1"
      # the tests with an assertion on measured time (the 1.7.2 release standard, CI3), alone, one file at a time: the
      # two growth files and the regex time limit
      - name: Timing tests (growth files)
        run: dart test -j 1 test/vault_growth_test.dart test/review_docs_growth_test.dart
        env:
          PII_SKIP_TIMING: "0"
      - name: Timing tests (the regex time limit)
        run: dart test test/regex_test.dart --plain-name "regexSpans takes time in proportion to the length of long inputs"
        env:
          PII_SKIP_TIMING: "0"

  android:
    if: github.repository == 'newmean-ai/pii' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    timeout-minutes: 25
    env:
      PII_SKIP_TIMING: "1"  # every step but the timing step: timing tests never share a step (CI3)
    defaults:
      run:
        working-directory: flutter/example
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: 3.47.7
          channel: stable
          cache: true
      - run: flutter pub get
      - run: flutter analyze
      - run: flutter test
      - run: flutter build apk --debug

  ios:
    # macOS only: outside the public repository only when dispatched with os: all
    if: github.repository == 'newmean-ai/pii' || inputs.os == 'all'
    runs-on: macos-latest
    timeout-minutes: 25
    defaults:
      run:
        working-directory: flutter/example
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: 3.47.7
          channel: stable
          cache: true
      - run: flutter pub get
      - run: flutter build ios --simulator --no-codesign
      - run: flutter build ios --debug --no-codesign

  publish-check:
    if: github.repository == 'newmean-ai/pii' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        working-directory: flutter
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: 3.47.7
          channel: stable
      - run: dart pub get
      - run: dart run tool/vendor_core.dart
      - run: dart pub publish --dry-run
