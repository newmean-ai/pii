// view is kept in the query string (?set=public&by=language&m=miss) so it can be linked.

  const $ = (id) => document.getElementById(id);
  const KEYS = ["tagline", "measured", "demo", "method", "language", "label", "miss", "over", "missDef", "overDef", "all", "spans", "few", "none", "fair", "public", "find", "nothing", "langs"];
  const LANGS = {
    en: ["English", ["What each model size misses and over-masks, per language and per label.", "Shipped v1.1 models, model only (no pattern layer), measured {d}. Lower is better.", "Demo", "Method", "Language", "Label", "Miss", "Over-masking", "% of PII characters left visible", "% of other characters masked", "All rows", "gold spans", "fewer than {n} gold spans: a few spans move the rate by a point or more", "not labelled in this set", "The public test is written like our training data; the external sets are the fairer comparison.", "Public test", "Find a language", "No match", "{n} languages"]],
    ko: ["한국어", ["모델 크기마다 놓치는 것과 지나치게 가리는 것, 언어별·라벨별로.", "배포한 v1.1 모델, 모델만(패턴 층 없음), {d} 측정. 낮을수록 좋습니다.", "데모", "측정 방법", "언어", "라벨", "놓침", "과잉 가림", "개인정보 글자 중 가려지지 않은 비율(%)", "개인정보가 아닌 글자 중 가려진 비율(%)", "전체", "정답 구간", "정답 구간 {n}개 미만: 구간 몇 개로도 비율이 1%p 넘게 움직입니다", "이 데이터에는 없는 라벨", "공개 테스트는 학습 데이터와 같은 설계로 만들었습니다. 외부 데이터가 더 공정한 비교입니다.", "공개 테스트", "언어 찾기", "맞는 항목 없음", "{n}개 언어"]],
    ja: ["日本語", ["モデルのサイズごとの見落としと隠しすぎを、言語別・ラベル別に。", "公開中の v1.1 モデル、モデルのみ（パターン層なし）、{d} 測定。低いほど良好です。", "デモ", "測定方法", "言語", "ラベル", "見落とし", "隠しすぎ", "個人情報の文字のうち隠れなかった割合（%）", "個人情報でない文字のうち隠された割合（%）", "全体", "正解の箇所", "正解の箇所が {n} 件未満：数件で割合が 1 ポイント以上動きます", "このデータにはないラベル", "公開テストは学習データと同じ設計で作られています。外部データの方が公平な比較です。", "公開テスト", "言語を検索", "該当なし", "{n} 言語"]],
    zh: ["简体中文", ["各尺寸模型的漏检与过度遮盖，按语言和标签列出。", "已发布的 v1.1 模型，仅模型（无模式层），{d} 测量。越低越好。", "演示", "方法", "语言", "标签", "漏检", "过度遮盖", "未被遮盖的个人信息字符占比（%）", "被遮盖的非个人信息字符占比（%）", "全部", "标注片段", "标注片段少于 {n} 个：几个片段就能让比率变动 1 个百分点以上", "该数据集未标注此标签", "公开测试集与训练数据按同一设计编写；外部数据集的比较更公平。", "公开测试", "查找语言", "没有匹配项", "{n} 种语言"]],
    "zh-Hant": ["繁體中文", ["各尺寸模型的漏偵測與過度遮蔽，依語言和標籤列出。", "已發布的 v1.1 模型，僅模型（不含規則比對層），{d} 測量。越低越好。", "示範", "方法", "語言", "標籤", "漏偵測", "過度遮蔽", "未被遮蔽的個人資料字元占比（%）", "被遮蔽的非個人資料字元占比（%）", "全部", "標註片段", "標註片段少於 {n} 個：幾個片段就能讓比率變動 1 個百分點以上", "此資料集未標註此標籤", "公開測試集與訓練資料依同一設計撰寫；外部資料集的比較更公平。", "公開測試", "搜尋語言", "沒有符合的項目", "{n} 種語言"]],
    es: ["Español", ["Lo que cada tamaño de modelo pasa por alto y oculta de más, por idioma y por etiqueta.", "Modelos v1.1 publicados, solo el modelo (sin capa de patrones), medidos el {d}. Cuanto más bajo, mejor.", "Demo", "Método", "Idioma", "Etiqueta", "Omitido", "Ocultado de más", "% de caracteres de datos personales que quedan visibles", "% de los demás caracteres que se ocultan", "Todo", "fragmentos anotados", "menos de {n} fragmentos anotados: unos pocos mueven la tasa un punto o más", "esta etiqueta no está anotada en este conjunto", "La prueba pública se escribió como nuestros datos de entrenamiento; los conjuntos externos son la comparación más justa.", "Prueba pública", "Buscar idioma", "Sin resultados", "{n} idiomas"]],
    fr: ["Français", ["Ce que chaque taille de modèle manque et masque en trop, par langue et par étiquette.", "Modèles v1.1 publiés, modèle seul (sans couche de motifs), mesurés le {d}. Plus bas, c'est mieux.", "Démo", "Méthode", "Langue", "Étiquette", "Manqué", "Masqué en trop", "% des caractères de données personnelles laissés visibles", "% des autres caractères masqués", "Tout", "segments annotés", "moins de {n} segments annotés : quelques-uns font bouger le taux d'un point ou plus", "étiquette non annotée dans ce jeu", "Le test public est écrit comme nos données d'entraînement ; les jeux externes sont la comparaison la plus juste.", "Test public", "Chercher une langue", "Aucun résultat", "{n} langues"]],
    de: ["Deutsch", ["Was jede Modellgröße übersieht und zu viel schwärzt, nach Sprache und Label.", "Veröffentlichte v1.1-Modelle, nur das Modell (ohne Musterebene), gemessen am {d}. Niedriger ist besser.", "Demo", "Methode", "Sprache", "Label", "Übersehen", "Zu viel geschwärzt", "% der Zeichen personenbezogener Daten, die sichtbar bleiben", "% der übrigen Zeichen, die geschwärzt werden", "Alle", "annotierte Stellen", "weniger als {n} annotierte Stellen: wenige davon bewegen die Rate um einen Punkt oder mehr", "in diesem Datensatz nicht annotiert", "Der öffentliche Test ist wie unsere Trainingsdaten geschrieben; die externen Datensätze sind der fairere Vergleich.", "Öffentlicher Test", "Sprache suchen", "Kein Treffer", "{n} Sprachen"]],
    pt: ["Português", ["O que cada tamanho de modelo deixa passar e oculta a mais, por idioma e por rótulo.", "Modelos v1.1 publicados, só o modelo (sem camada de padrões), medidos em {d}. Quanto menor, melhor.", "Demo", "Método", "Idioma", "Rótulo", "Omitido", "Ocultado a mais", "% dos caracteres de dados pessoais que ficam visíveis", "% dos demais caracteres que são ocultados", "Tudo", "trechos anotados", "menos de {n} trechos anotados: poucos já movem a taxa em um ponto ou mais", "rótulo não anotado neste conjunto", "O teste público foi escrito como nossos dados de treino; os conjuntos externos são a comparação mais justa.", "Teste público", "Buscar idioma", "Nada encontrado", "{n} idiomas"]],
  };
  // label → [icon symbol, colour family], as the demo's legend (IP_ADDRESS is a gold label of the public test only)
  const LOOK = { PERSON: ["l-person", "a"], EMAIL: ["l-mail", "b"], PHONE: ["l-phone", "b"], ADDRESS: ["l-pin", "c"], ID_NUMBER: ["l-id", "d"],
    FINANCIAL: ["l-card", "d"], ORG: ["l-org", "e"], USERNAME: ["l-at", "b"], URL: ["l-link", "e"], DATE_OF_BIRTH: ["l-cake", "c"],
    SECRET: ["l-key", "d"], IP_ADDRESS: ["l-ip", "e"] };
  const esc = (s) => String(s).replace(/[&<>"]/g, (c) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" })[c]);

  function pickLang() {
    try {
      const saved = localStorage.getItem("pii-demo-lang");
      if (saved && LANGS[saved]) return saved;
    } catch {}
    for (const l of navigator.languages ?? [navigator.language]) {
      if (/^zh-(hant|tw|hk|mo)\b/i.test(l)) return "zh-Hant";
      const base = l.toLowerCase().split("-")[0];
      if (LANGS[base]) return base;
    }
    return "en";
  }
  let lang = pickLang();
  const t = (k, n) => {
    const s = LANGS[lang][1][KEYS.indexOf(k)];
    return n === undefined ? s : s.replace("{n}", n);
  };

  // state, from the query string
  const q = new URLSearchParams(location.search);
  const state = { set: q.get("set") || "public", by: q.get("by") === "label" ? "label" : "language", m: q.get("m") === "over" ? "over" : "miss",
    sort: null, dir: 1, find: "" };
  let data = null;

  const fmtN = () => new Intl.NumberFormat(lang);
  const fmtP = () => new Intl.NumberFormat(lang, { minimumFractionDigits: 1, maximumFractionDigits: 1 });
  let names = null;
  const langName = (code, fallback) => {
    try {
      names = names && names.lang === lang ? names : { lang, d: new Intl.DisplayNames([lang], { type: "language" }) };
      const s = names.d.of(code);
      return s && s !== code ? s.charAt(0).toLocaleUpperCase(lang) + s.slice(1) : fallback;
    } catch {
      return fallback;
    }
  };
  const setName = (e) => (e.id === "public" ? t("public") : e.name);

  function save() {
    const p = new URLSearchParams();
    if (state.set !== "public") p.set("set", state.set);
    if (state.by !== "language") p.set("by", state.by);
    if (state.m !== "miss") p.set("m", state.m);
    const s = p.toString();
    try { history.replaceState(null, "", location.pathname + (s ? `?${s}` : "")); } catch {}
  }

  function applyLang() {
    document.documentElement.lang = lang;
    for (const el of document.querySelectorAll("[data-i18n]")) el.textContent = t(el.dataset.i18n);
    for (const el of document.querySelectorAll("[data-i18n-title]")) el.title = t(el.dataset.i18nTitle);
    $("find").placeholder = t("find");
    $("find").setAttribute("aria-label", t("find"));
    if (data) {
      const d = new Intl.DateTimeFormat(lang, { dateStyle: "medium", timeZone: "UTC" }).format(new Date(`${data.measured}T00:00:00Z`));
      $("measured").textContent = t("measured").replace("{d}", d);
      $("note-few").textContent = `† ${t("few", data.few)}`;
      $("note-none").textContent = `— ${t("none")}`;
    }
    $("note-fair").textContent = t("fair");
    render();
  }

  function setsBar() {
    $("sets").innerHTML = data.sets.map((e) => {
      const n = e.languages > 1 ? String(e.languages) : e.by_language[0].code;
      return `<button type="button" data-set="${esc(e.id)}" aria-pressed="${e.id === state.set}">${esc(setName(e))}<small>${esc(n)}</small></button>`;
    }).join("");
  }

  function render() {
    if (!data) return;
    setsBar();
    const set = data.sets.find((e) => e.id === state.set) || data.sets[0];
    state.set = set.id;
    const one = set.languages < 2;   // Nemotron-PII (en) and KDPII (ko): by label only
    const by = one ? "label" : state.by;
    $("by-language").disabled = one;
    $("by-language").setAttribute("aria-pressed", String(by === "language"));
    $("by-label").setAttribute("aria-pressed", String(by === "label"));
    $("m-miss").setAttribute("aria-pressed", String(state.m === "miss"));
    $("m-over").setAttribute("aria-pressed", String(state.m === "over"));
    $("def").textContent = t(state.m === "miss" ? "missDef" : "overDef");
    $("find-wrap").hidden = by !== "language";
    $("note-none").hidden = by !== "label" || !set.by_label.some((r) => !r.pii);
    $("note-few").hidden = !(by === "label" ? set.by_label : set.by_language).some((r) => r.few);
    $("note-fair").hidden = set.id !== "public";
    const k = state.m === "miss" ? 0 : 1;
    const N = fmtN(), P = fmtP();
    const sizes = data.sizes;

    // head: name, then one column per size (sortable)
    const arrow = (col) => (state.sort === col ? `<span class="arrow" aria-hidden="true">${state.dir > 0 ? "▲" : "▼"}</span>` : "");
    const aria = (col) => (state.sort === col ? ` aria-sort="${state.dir > 0 ? "ascending" : "descending"}"` : "");
    $("head").innerHTML =
      `<th class="name" scope="col"${aria("name")}><button type="button" data-sort="name">${esc(t(by))} ${arrow("name")}<small>${esc(t("spans"))}</small></button></th>` +
      sizes.map((s) => `<th class="n" scope="col"${aria(s)}><button type="button" data-sort="${s}">${s} ${arrow(s)}<small>${data.mb[s]} MB</small></button></th>`).join("");

    // rows
    let rows = by === "language" ? set.by_language.map((r) => ({ ...r, title: langName(r.code, r.name), sub: r.code }))
      : set.by_label.map((r) => ({ ...r, title: r.label, sub: "" }));
    const f = state.find.trim().toLocaleLowerCase(lang);
    if (by === "language" && f)
      rows = rows.filter((r) => r.title.toLocaleLowerCase(lang).includes(f) || r.name.toLowerCase().includes(f) || r.code === f);
    if (state.sort === "name") {
      const coll = new Intl.Collator(lang);
      rows.sort((a, b) => state.dir * coll.compare(a.title, b.title));
    } else if (state.sort) {
      const v = (r) => r[state.sort][k];
      rows.sort((a, b) => (v(a) === null) - (v(b) === null) || state.dir * (v(a) - v(b)));
    } else if (by === "language") {
      const coll = new Intl.Collator(lang);
      rows.sort((a, b) => coll.compare(a.title, b.title));
    }
    const shown = [{ ...set.all, title: t("all"), all: true, few: false }, ...rows];
    const max = Math.max(0, ...shown.flatMap((r) => sizes.map((s) => r[s][k] ?? 0)));
    const cell = (v) => {
      if (v === null) return `<td class="n">—</td>`;
      const pct = max > 0 ? Math.round(55 * v / max) : 0;
      return `<td class="n" style="background:color-mix(in srgb, var(--heat) ${pct}%, transparent)">${P.format(v)}</td>`;
    };
    $("rows").innerHTML = shown.map((r) => {
      let name;
      if (r.all) {
        const parts = [set.languages > 1 ? t("langs", N.format(set.languages)) : langName(set.by_language[0].code, set.by_language[0].name), N.format(set.all.spans)];
        name = `<b>${esc(r.title)}</b><small>${esc(parts.join(" · "))}</small>`;
      } else if (by === "language") {
        name = `<b>${esc(r.title)}</b><small>${esc(r.code)} · ${N.format(r.spans)}${r.few ? " †" : ""}</small>`;
      } else {
        const [ic, fam] = LOOK[r.label] || ["l-id", "e"];
        name = `<span class="tag f-${fam}"><svg class="li" aria-hidden="true"><use href="#${ic}"/></svg>${esc(r.label)}</span>` +
          `<small>${r.pii ? N.format(r.spans) + (r.few ? " †" : "") : "—"}</small>`;
      }
      return `<tr class="${r.all ? "all" : ""}"><td class="name">${name}</td>${sizes.map((s) => cell(r[s][k])).join("")}</tr>`;
    }).join("");
    $("empty").hidden = rows.length > 0;
    $("empty").textContent = t("nothing");
    save();
  }

  // controls
  const sel = $("lang");
  sel.innerHTML = Object.entries(LANGS).map(([c, [n]]) => `<option value="${c}">${n}</option>`).join("");
  sel.value = lang;
  sel.addEventListener("change", () => {
    lang = sel.value;
    try { localStorage.setItem("pii-demo-lang", lang); } catch {}
    applyLang();
  });
  $("sets").addEventListener("click", (ev) => {
    const b = ev.target.closest("button[data-set]");
    if (!b) return;
    state.set = b.dataset.set;
    state.sort = null;
    render();
  });
  for (const [id, key, val] of [["by-language", "by", "language"], ["by-label", "by", "label"], ["m-miss", "m", "miss"], ["m-over", "m", "over"]])
    $(id).addEventListener("click", () => {
      state[key] = val;
      if (key === "by") state.sort = null;
      render();
    });
  $("head").addEventListener("click", (ev) => {
    const b = ev.target.closest("button[data-sort]");
    if (!b) return;
    const col = b.dataset.sort;
    // a size column starts with the highest rate (the worst), the name column from A
    state.dir = state.sort === col ? -state.dir : col === "name" ? 1 : -1;
    state.sort = col;
    render();
  });
  $("find").addEventListener("input", (ev) => {
    state.find = ev.target.value;
    render();
  });

  applyLang();
  // data.json sits next to the page; /results without the slash still finds it
  const url = new URL("data.json", location.href.replace(/\/results(?=$|[?#])/, "/results/"));
  fetch(url).then((r) => {
    if (!r.ok) throw new Error(`HTTP ${r.status}`);
    return r.json();
  }).then((d) => {
    data = d;
    applyLang();
  }).catch(() => {
    $("empty").hidden = false;
    $("empty").innerHTML = `<a href="${$("method").href}">docs/results/models-v1.1-by-language-label.md</a>`;
  });
})();
</script>
