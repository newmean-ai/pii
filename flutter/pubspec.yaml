name: newmean_pii
description: >-
  Detect and mask personal information (PII) in text on the device, in 54 languages, with the newmean-pii models
  (dart:ffi over a small C engine; nothing is sent anywhere).
version: 1.0.0
homepage: https://newmean.ai
repository: https://github.com/newmean-ai/pii
issue_tracker: https://github.com/newmean-ai/pii/issues
topics:
  - privacy
  - pii
  - nlp
  - ffi
  - redaction

environment:
  sdk: ^3.10.0

platforms:
  android:
  ios:
  linux:
  macos:
  windows:

dependencies:
  code_assets: ^1.2.0
  crypto: ^3.0.6
  ffi: ^2.1.4
  hooks: ^2.0.0
  logging: ^1.3.0
  native_toolchain_c: ^0.19.2

dev_dependencies:
  lints: ^6.0.0
  test: ^1.26.3
